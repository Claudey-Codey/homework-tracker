# Deploys the API in api/ (a Cloudflare Worker with a D1 database and an R2
# bucket): applies new database migrations, then publishes the Worker.
#
# Runs on every push to main that touches the API, and can be started by hand
# from the Actions tab. Needs two repository secrets (Settings ▸ Secrets and
# variables ▸ Actions):
#   CLOUDFLARE_API_TOKEN   a token with Workers Scripts, D1 and R2 edit rights
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account's id
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler d1 migrations apply donedey --remote
      - run: npx wrangler deploy
