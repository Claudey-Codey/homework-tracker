# XcodeGen spec — optional shortcut to generate TaskMng.xcodeproj.
# Install XcodeGen (`brew install xcodegen`) then run `xcodegen generate`
# in this folder. See README.md for the manual (no-tools) path instead.
name: TaskMng
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  TaskMng:
    type: application
    platform: iOS
    sources:
      - TaskMng
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TaskMng
        PRODUCT_NAME: TaskMng
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM is left blank on purpose — pick your team once in
        # Xcode ▸ Signing & Capabilities. (Tell me your Team ID and I can bake
        # it in here so it survives project regeneration.)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
