# XcodeGen spec — optional shortcut to generate Donedey.xcodeproj.
# Install XcodeGen (`brew install xcodegen`) then run `xcodegen generate`
# in this folder. See README.md for the manual (no-tools) path instead.
name: Donedey
options:
  bundleIdPrefix: com.tunimamluk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Donedey:
    type: application
    platform: iOS
    sources:
      - Donedey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # The bundle ID keeps the app's old name on purpose. iOS identifies an
        # app by its bundle ID, so changing it would install Donedey as a
        # different app beside the old one, and the assignments, exams and
        # settings already on the phone would not carry over.
        PRODUCT_BUNDLE_IDENTIFIER: com.tunimamluk.TaskMng
        PRODUCT_NAME: Donedey
        # The name under the icon on the Home Screen.
        INFOPLIST_KEY_CFBundleDisplayName: Donedey
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM is left blank on purpose — pick your team once in
        # Xcode ▸ Signing & Capabilities. (Tell me your Team ID and I can bake
        # it in here so it survives project regeneration.)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # Shown when the app first asks for the camera (Scan Document, Take Photo).
        # Without it, iOS stops the app as soon as the camera opens.
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan worksheets and take photos to attach to assignments and exams."
