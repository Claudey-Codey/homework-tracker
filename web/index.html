<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <title>TaskMng</title>
    <meta name="description" content="Assignments, homework and exams — a school planner." />
    <meta name="theme-color" content="#f2f2f7" />

    <!-- Home Screen app on iOS. The status bar is opaque ("default") rather
         than drawn over the page ("black-translucent"): on iOS 26 the
         translucent style leaves a strip at the bottom of the screen, as tall
         as the status bar, that the page can never draw in. The bar takes its
         colour from theme-color, which App.tsx keeps in step with light/dark.
         iOS reads this once, when the app is added to the Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TaskMng" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The Home Screen icon. iOS can't switch a web app's icon between
         light and dark the way it does for App Store apps; it copies the
         icon once, when the app is added. So the link points at the dark
         icon whenever the phone is in dark mode, and adding the app then
         gives the dark one. There's a single link on purpose: nothing says
         how iOS would choose between two. -->
    <link id="home-screen-icon" rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      (function () {
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
        if (!dark) return;
        var show = function () {
          document.getElementById("home-screen-icon").href = dark.matches
            ? "./icons/apple-touch-icon-dark.png"
            : "./icons/apple-touch-icon.png";
        };
        show();
        dark.addEventListener("change", show);
      })();
    </script>
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
