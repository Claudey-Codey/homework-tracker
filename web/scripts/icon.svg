<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon, light appearance: an iPhone switch turned on, with a tick
       in the knob. icon-dark.svg and icon-tinted.svg are the same drawing for
       dark and tinted Home Screens; keep the three in step. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EDF4"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CD964"/>
      <stop offset="1" stop-color="#2DB84F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b3d1a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>
  <rect x="172" y="342" width="680" height="340" rx="170" fill="url(#track)"/>
  <rect x="172" y="342" width="680" height="340" rx="170" fill="none" stroke="#000" stroke-opacity="0.06" stroke-width="6"/>
  <circle cx="682" cy="512" r="146" fill="#fff" filter="url(#shadow)"/>
  <path d="M620 516l42 42 80-88" fill="none" stroke="#2DB84F" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
