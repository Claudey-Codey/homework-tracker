<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The dark version of icon.svg, in the style of iOS's dark app icons:
       a near-black background, the card in dark grey, and the marks in the
       dark-mode system colours. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26272B"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3E"/>
      <stop offset="1" stop-color="#2A2A2E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="232" y="212" width="560" height="600" rx="96" fill="url(#card)"/>
  </g>
  <!-- Ticked first step -->
  <circle cx="352" cy="378" r="48" fill="#30D158"/>
  <path d="M328 380l18 18 34-38" fill="none" stroke="#0B0B0D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="436" y="360" width="256" height="36" rx="18" fill="#55565C"/>
  <!-- Open steps -->
  <circle cx="352" cy="512" r="40" fill="none" stroke="#0A84FF" stroke-width="16"/>
  <rect x="436" y="494" width="256" height="36" rx="18" fill="#0A84FF"/>
  <circle cx="352" cy="646" r="40" fill="none" stroke="#0A84FF" stroke-width="16"/>
  <rect x="436" y="628" width="190" height="36" rx="18" fill="#0A84FF"/>
</svg>
